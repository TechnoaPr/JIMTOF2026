.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-2);font-size:1.2rem;width:32px;height:32px;cursor:pointer;display:none}

/* 運営・マップ */
.loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:48px 16px;text-align:center}
.loading b{font-size:1.05rem}

@keyframes blink{50%{background:var(--plate-edge)}}
.empty b{display:block;font-size:1rem;color:var(--ink);margin-bottom:4px}
.op-badge{align-self:flex-start;font-size:.7rem;font-weight:700;border:1px solid var(--ink);border-radius:999px;padding:1px 8px;line-height:1.6}

.maplink{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--map-bg);border:1px solid var(--map-edge);color:var(--map-ink);border-radius:10px;padding:11px 14px;text-decoration:none;font-weight:700;font-size:.9rem;min-height:44px}

<script>
/* ============================================================
   設定（ここだけ書き換えれば運用できます）
   ============================================================ */
const CONFIG = {
  // Googleスプレッドシートを「ウェブに公開」→「カンマ区切り形式(.csv)」で発行したURLを貼ります。
  // 空のままなら、同じフォルダの data.csv を読み込みます。
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBjW9zrMs0l4Nr8pM1Ep0if3kd4Ddisr7v0wk8-XAFy5OOmynBbAGrBzNGUF8tWWgav_G29vm403iF/pub?gid=1491173051&single=true&output=csv",
  FALLBACK_CSV: "data.csv",
  // 「設定」タブを「ウェブに公開」→「カンマ区切り形式(.csv)」で発行したURL（データ更新日時の表示に使います）
  SETTINGS_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQBjW9zrMs0l4Nr8pM1Ep0if3kd4Ddisr7v0wk8-XAFy5OOmynBbAGrBzNGUF8tWWgav_G29vm403iF/pub?gid=1373910213&single=true&output=csv",
  CONTACT_X: "TechnoaPr",
  OFFICIAL_URL: "https://www.jimtof.org/",
  // Googleアナリティクス4の測定ID（例：G-XXXXXXXXXX）。空なら計測しません。
  GA4_ID: "",

  // エリアごとの公式マップ（JIMTOF公式サイト「小間割図検索」の各ホールのページ）
  MAP_URLS: {
    e13: "https://www.jimtof.org/map/jp/e1-3_booth/e1-3.html", // 東1〜3ホール
    e78: "https://www.jimtof.org/map/jp/e7-8_booth/e7-8.html", // 東7〜8ホール
    w12: "https://www.jimtof.org/map/jp/w1-2_booth/w1-2.html", // 西1〜2ホール・アトリウム
    w34: "https://www.jimtof.org/map/jp/w3-4_booth/w3-4.html", // 西3〜4ホール
    s12: "https://www.jimtof.org/map/jp/s1-2_booth/s1-2.html", // 南1〜2ホール
    s34: "https://www.jimtof.org/map/jp/s3-4_booth/s3-4.html"  // 南3〜4ホール
  },
  // エリアが決まっていないときに開く、小間割図の一覧ページ
  MAP_INDEX_URL: "https://www.jimtof.org/jp/exhi_search_booth.html",

  // 運営紹介
  OPERATOR_NAME: "株式会社テクノア",
  OPERATOR_TEXT: "個別受注生産の工場向け生産管理システム「TECHS」をつくっています。",
  OPERATOR_LINK_LABEL: "TECHSを見る",
  OPERATOR_LINK_URL: "https://techs-s.com/",

};

/* ============================================================ */
const STORE_KEY = "jimtof2026x:data";
const STATUS = {
  stay:  { label: "常駐予定",   cls: "st-stay"  },
  maybe: { label: "気まぐれ来店", cls: "st-maybe" },
  open:  { label: "情報募集中", cls: "st-open"  }
};
const HALL_GROUPS = [
  { key: "e13", label: "東1〜3ホール",            test: h => /^東[1-3]/.test(h) },
  { key: "e78", label: "東7〜8ホール",            test: h => /^東[78]/.test(h) },
  { key: "w12", label: "西1〜2ホール・アトリウム", test: h => /^西[12]|アトリウム/.test(h) },
  { key: "w34", label: "西3〜4ホール",            test: h => /^西[34]/.test(h) },
  { key: "s12", label: "南1〜2ホール",            test: h => /^南[12]/.test(h) },
  { key: "s34", label: "南3〜4ホール",            test: h => /^南[34]/.test(h) },
  { key: "tbd", label: "ホール調査中",            test: h => !h }
];
const X_SVG = '<svg class="xicon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';

const state = { rows: [], q: "", hall: "all", boothOrder: false, source: "", updated: null, scrollY: 0 };


/* ---------- utilities ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fold = s => String(s ?? "").normalize("NFKC").toLowerCase()
  .replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
  .replace(/[\s・\-ー－（）()株式会社]/g, "");

function parseCSV(text) {
  text = text.replace(/^\uFEFF/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().replace(/^(?:\uFEFF|\\x[0-9A-F]{2})+/i, ""));
  return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] ?? "").trim()])));
}

function deriveHall(booth, hallCol) {
  const m = booth.match(/^([EWS])\s*(\d)/i);
  if (m) return { E: "東", W: "西", S: "南" }[m[1].toUpperCase()] + m[2] + "ホール";
  const h = (hallCol || "").trim();
  return (!h || /要確認|調査中|未定/.test(h)) ? "" : h;
}
function normStatus(s) {
  s = s || "";
  if (/常駐/.test(s)) return "stay";
  if (/気まぐれ/.test(s)) return "maybe";
  return "open";
}
function normHandle(s) {
  return String(s || "").trim()
    .replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, "")
    .replace(/^@/, "").split(/[/?#\s]/)[0];
}
function boothSortKey(b) {
  const m = b.match(/^([EWS])(\d+)/i);
  if (!m) return [9, 0];
  return [{ E: 0, W: 1, S: 2 }[m[1].toUpperCase()], parseInt(m[2], 10)];
}

function normalize(raw) {
  const out = [];
  raw.forEach((r, i) => {
    if (!r.company_name) return;
    const booth = (r.booth_number || "").replace(/要確認|調査中/, "").trim();
    const hall = deriveHall(booth, r.hall);
    const grp = HALL_GROUPS.find(g => g.test(hall));
    const handle = normHandle(r.x_account);
    out.push({
      id: String(r.id || i + 1).trim(),
      booth, hall, group: grp ? grp.key : "other",
      name: r.company_name, feat: r.exhibit_features || "",
      handle, status: normStatus(r.presence_status),
      evidence: r.evidence_url || "",
      hay: fold([r.company_name, r.exhibit_features, handle, booth, hall].join(" "))
    });
  });
  out.sort((a, b) => {
    const ka = boothSortKey(a.booth), kb = boothSortKey(b.booth);
    return ka[0] - kb[0] || ka[1] - kb[1] || a.name.localeCompare(b.name, "ja");
  });
  return out;
}

/* ---------- data loading（会場の電波が弱くても動くよう、前回分を保存） ---------- */
async function fetchText(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(res.status);
  const t = await res.text();
  if (!/company_name/.test(t)) throw new Error("format");
  return t;
}
function parseStamp(v) {
  const m = String(v || "").match(/(\d{4})\D(\d{1,2})\D(\d{1,2})\D+(\d{1,2}):(\d{2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null;
}
async function loadSettings() {
  if (!CONFIG.SETTINGS_CSV_URL) return;
  try {
    const res = await fetch(CONFIG.SETTINGS_CSV_URL, { cache: "no-store" });
    if (!res.ok) return;
    const lines = (await res.text()).replace(/^\uFEFF/, "").split(/\r?\n/);
    for (const line of lines) {
      const [k, ...v] = line.split(",");
      if (k.trim() === "updated_at") {
        const d = parseStamp(v.join(",").replace(/"/g, ""));
        if (d) { state.sheetUpdated = d; try { localStorage.setItem(STORE_KEY + ":upd", String(d.getTime())); } catch (e) {} render(); }
      }
    }
  } catch (e) {}
}
async function loadData() {
  try { const u = localStorage.getItem(STORE_KEY + ":upd"); if (u) state.sheetUpdated = new Date(+u); } catch (e) {}
  loadSettings();
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) {}
  if (cached && cached.csv) {
    state.rows = normalize(parseCSV(cached.csv));
    state.updated = new Date(cached.at); state.source = "cache";
    render();
  }
  const urls = [CONFIG.SHEET_CSV_URL, CONFIG.FALLBACK_CSV].filter(Boolean);
  for (const u of urls) {
    try {
      const csv = await fetchText(u);
      state.rows = normalize(parseCSV(csv));
      state.updated = new Date(); state.source = "live";
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ csv, at: Date.now() })); } catch (e) {}
      render();
      return;
    } catch (e) { /* 次の読み込み先へ */ }
  }
  if (!state.rows.length) { state.source = "error"; render(); }
}

/* ---------- analytics ---------- */
function track(name, params) {
  if (CONFIG.GA4_ID && window.gtag) gtag("event", name, params || {});
}
if (CONFIG.GA4_ID) {
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + CONFIG.GA4_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag("js", new Date()); gtag("config", CONFIG.GA4_ID);
}

/* ---------- views ---------- */
const app = document.getElementById("app");

function plate(r) {
  const tbd = !r.booth;
  const no = tbd ? "調査中" : r.booth;
  const long = no.length > 6 ? " long" : "";
  const area = { "東": " area-e", "西": " area-w", "南": " area-s" }[(r.hall || "").charAt(0)] || "";
  return `<div class="plate${tbd ? " tbd" : ""}${area}" aria-label="小間番号 ${esc(no)}">
    <span class="no${long}">${esc(no).replace(/-/g, "-<wbr>")}</span>
    <span class="hall">${esc(r.hall || "ホール調査中")}</span></div>`;
}
function mapUrl(group) { return (CONFIG.MAP_URLS && CONFIG.MAP_URLS[group]) || CONFIG.MAP_INDEX_URL || CONFIG.OFFICIAL_URL; }
function groupLabel(group) { const g = HALL_GROUPS.find(x => x.key === group); return g ? g.label : ""; }
const MAP_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>';
const PIN_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>';
const EXT_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M20 14v6H4V4h6"/></svg>';
const isOperator = r => r.handle && r.handle.toLowerCase() === CONFIG.CONTACT_X.toLowerCase();
function operatorCard() {
  const op = state.rows.find(isOperator);
  return `<section class="operator">
    <div><small>このガイドの運営</small><b>${esc(CONFIG.OPERATOR_NAME)}</b>
      <p>${esc(CONFIG.OPERATOR_TEXT)}${op && op.booth ? `${esc(op.hall)} ${esc(op.booth)} でお待ちしています。` : ""}</p>
      <div class="links">${CONFIG.OPERATOR_LINK_URL ? `<a href="${esc(CONFIG.OPERATOR_LINK_URL)}" target="_blank" rel="noopener">${esc(CONFIG.OPERATOR_LINK_LABEL)}</a>` : ""}
      ${op ? `<a href="#/booth/${encodeURIComponent(op.id)}">ブースの場所</a>` : ""}</div></div></section>`;
}
function badge(st) { return `<span class="badge ${STATUS[st].cls}">${STATUS[st].label}</span>`; }

/* 並び順：初期は運営（テクノア）が先頭、ほかは開くたびにランダム（開いている間は固定）。
   「ブース番号順」にチェックすると小間番号順。 */
const RANK = new Map();
function rankOf(id) { if (!RANK.has(id)) RANK.set(id, Math.random()); return RANK.get(id); }
function filtered() {
  const q = fold(state.q);
  const list = state.rows.filter(r =>
    (state.hall === "all" || r.group === state.hall) &&
    (!q || r.hay.includes(q)));
  if (!state.boothOrder) {
    list.sort((a, b) => (isOperator(b) - isOperator(a)) || (rankOf(a.id) - rankOf(b.id)));
  }
  return list;
}

function resultsHTML() {
  const rows = filtered();
  if (state.source === "error" && !state.rows.length)
    return `<div class="empty">出展社データを読み込めませんでした。電波の良い場所で、ページを再読み込みしてください。</div>`;
  if (!state.rows.length) return `<div class="loading"><div class="dots-run" aria-hidden="true"><i></i><i></i><i></i></div><b>出展社リストを準備しています</b><span>電波が弱いときは、前回のデータを先に表示します</span></div>`;
  if (!rows.length)
    return `<div class="empty">条件に合うブースがありません。キーワードを短くするか、絞り込みを「すべて」に戻してください。<br><button class="btn-guide" id="reset">絞り込みを解除する</button></div>`;
  const mapTop = (state.hall !== "all" && state.hall !== "tbd")
    ? `<a class="maplink" href="${esc(mapUrl(state.hall))}" target="_blank" rel="noopener">${MAP_ICON}<span>${esc(groupLabel(state.hall))}の公式マップを開く</span>${EXT_ICON}</a>` : "";
  return mapTop + `<ul class="list">${rows.map(r => `<li class="entry"><a class="item" href="#/booth/${encodeURIComponent(r.id)}">
      ${plate(r)}
      <div class="body">${isOperator(r) ? '<span class="op-badge">このガイドの運営ブース</span>' : ""}
        <h2 class="name">${esc(r.name)}</h2>
        <p class="feat">${esc(r.feat)}</p>
        ${r.handle ? `<span class="handle">${X_SVG}@${esc(r.handle)}</span>` : ""}
      </div></a></li>`).join("")}</ul>`;
}
function countHTML() {
  const n = filtered().length;
  const companies = new Set(state.rows.map(r => r.name)).size;
  const t = state.sheetUpdated ? state.sheetUpdated.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
  const note = (t ? `データ更新：${t}` : "") + (state.source === "cache" ? "（保存済みデータを表示中）" : "");
  return `<span><b>${n}</b>ブースを表示中（全${companies}社・${state.rows.length}ブース）</span><span>${esc(note)}</span>`;
}
function updateResults() {
  document.getElementById("results").innerHTML = resultsHTML();

}

    ${r.group && r.group !== "tbd" && r.group !== "other" ? `<a class="mapbtn" href="${esc(mapUrl(r.group))}" target="_blank" rel="noopener">${PIN_ICON}<span class="grow"><b>${esc(groupLabel(r.group))}の公式マップを開く</b><small>JIMTOF公式サイトの会場図が開きます</small></span>${EXT_ICON}</a>` : ""}

    ${others.length ? `<section class="card others"><h2>この会社のほかのブース</h2>${others.map(o => `<a href="#/booth/${encodeURIComponent(o.id)}">${esc(o.booth || "調査中")}（${esc(o.hall || "ホール調査中")}）</a>`).join("")}</section>` : ""}

/* ---------- router ---------- */
let lastRoute = "";
function render() {
  const h = location.hash || "#/";
  const m = h.match(/^#\/booth\/(.+)$/);
  const route = m ? "booth" : h === "#/guide" ? "guide" : "list";

  if (route === "list") {
    if (lastRoute !== "list" || !document.getElementById("results")) {
      app.innerHTML = listView();
      bindList();
      updateResults();
      if (lastRoute && lastRoute !== "list") window.scrollTo(0, state.scrollY);
    } else {
      updateResults();
    }
    lastRoute = "list";
    return;
  }

  if (lastRoute === "list") state.scrollY = window.scrollY;
  let key = route;
  if (route === "booth") {
    const id = decodeURIComponent(m[1]);
    key = "booth:" + id;
    app.innerHTML = detailView(id);
    const r = state.rows.find(x => x.id === id);
    if (r && lastRoute !== key) track("view_booth", { company: r.name, booth: r.booth });
    const x = document.getElementById("xlink");
    if (x && r) x.addEventListener("click", () => track("open_x", { company: r.name, account: r.handle }));
  } else {
    app.innerHTML = guideView();
  }
  if (lastRoute !== key) window.scrollTo(0, 0);
  lastRoute = key;
}

function bindList() {
  const q = document.getElementById("q");
  let composing = false;
  const apply = () => { state.q = q.value; updateResults(); };
  q.addEventListener("compositionstart", () => { composing = true; });
  q.addEventListener("compositionend", () => { composing = false; apply(); });
  q.addEventListener("input", e => { if (!composing && !e.isComposing) apply(); });
  document.getElementById("clear").addEventListener("click", () => { q.value = ""; apply(); q.focus(); });
  document.getElementById("hall").addEventListener("change", e => { state.hall = e.target.value; updateResults(); });
  document.getElementById("boothOrder").addEventListener("change", e => { state.boothOrder = e.target.checked; updateResults(); });

}

window.addEventListener("hashchange", render);
render();
loadData();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
